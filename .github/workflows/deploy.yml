name: Tests y despliegue en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # Guía de uso en PDF con capturas reales de la app (no bloquea el despliegue si falla).
      - name: Guía de uso — compilación para las capturas
        id: guide_build
        continue-on-error: true
        run: npx vite build --outDir dist-guide
      - name: Guía de uso — navegador para las capturas
        id: guide_browser
        if: steps.guide_build.outcome == 'success'
        continue-on-error: true
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Guía de uso — capturas y PDF
        id: guide_pdf
        if: steps.guide_browser.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/guide/make-guide.mjs guia-de-uso.pdf
      - uses: actions/upload-artifact@v4
        if: steps.guide_pdf.outcome == 'success'
        with:
          name: guia-de-uso
          path: |
            guia-de-uso.pdf
            docs/guia/img/*.png

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Publicar la guía junto a la app
        if: steps.guide_pdf.outcome == 'success'
        run: cp guia-de-uso.pdf dist/guia-de-uso.pdf
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
